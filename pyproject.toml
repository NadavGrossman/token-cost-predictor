[project]
name = "cs-workshop"
version = "0.1.0"
description = "Predict how many output tokens an LLM will spend answering a query"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "transformers>=4.41",
    "torch>=2.3",
    "scikit-learn>=1.5",
    "typesafe-sdk[http2]>=0.7.2",
    "tiktoken>=0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/token_cost"]
